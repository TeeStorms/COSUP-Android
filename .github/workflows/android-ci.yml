name: Android CI

on:
  push:
    branches:
      - '**'          # every branch, so any teammate's push triggers it
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # The real file is stored (base64) in the repo secret GOOGLE_SERVICES_JSON.
      # Without it we write a placeholder so the build still passes; sign-in only works in builds that have the real file.
      - name: Provide google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
          elif [ ! -f app/google-services.json ]; then
            cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "1031564678835",
              "project_id": "cosup-semester2",
              "storage_bucket": "cosup-semester2.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1031564678835:android:0000000000000000000000",
                  "android_client_info": { "package_name": "com.cosup.app" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "PLACEHOLDER-NOT-A-REAL-KEY" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          fi

      - name: Lint
        run: ./gradlew lintDebug

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cosup-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
